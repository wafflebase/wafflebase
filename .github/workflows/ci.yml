# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Merge queue. When a maintainer clicks "Merge when ready", GitHub builds a
  # throwaway `gh-readonly-queue/main/pr-<n>-<sha>` branch holding that PR merged
  # onto main's current tip — plus any PRs ahead of it in the queue — and asks for
  # main's required checks against that speculative merge. The three required
  # contexts (`verify-self (22.x)`, `verify-browser (22.x)`,
  # `verify-integration (22.x)`) are the matrix job names below and do not change
  # with the event, so the queue is satisfied by exactly the checks a PR is.
  #
  # This trigger has to land BEFORE "Require merge queue" is switched on: with the
  # setting on and the trigger absent, a queued PR waits on checks that never start
  # and is dequeued when the status-check timeout expires. Until the setting is on
  # it is inert — no queue means no `merge_group` event and no extra runs. See
  # docs/design/harness-engineering.md#merge-queue and MAINTAINING.md#merge-queue.
  #
  # `checks_requested` is the only activity type GitHub defines today; naming it
  # keeps the trigger narrow if more are added later.
  merge_group:
    types: [checks_requested]

# READ ONLY, and that is a change. This workflow used to carry workflow-level
# `pull-requests: write` + `issues: write` so `verify-self` could post its summary
# comment — in a job that runs `pnpm verify:self`, i.e. arbitrary build and test
# code from the pull request's own tree. Every write this workflow used to do now
# happens in `.github/workflows/ci-report.yml`, which is `workflow_run`-triggered,
# executes no PR code, and carries a scoped GitHub App token.
#
# Two reasons, and the second is why the comment never worked anyway:
#
#   1. Least privilege. MAINTAINING.md's merge-queue notes call narrowing these
#      out "the obvious hardening follow-up", because a `merge_group` run executes
#      PR code in this repository alongside whatever this block grants.
#   2. It was dead code on every fork PR. Secrets — and a writable GITHUB_TOKEN —
#      are withheld from a fork's `pull_request` run (the CODECOV_TOKEN note in
#      `verify-self` says the same thing), so `createComment` failed silently. Every
#      merged PR from #789 to #798 came from a fork and none of them ever received
#      the verification comment.
permissions:
  contents: read

jobs:
  # WHAT CHANGED, decided ONCE. The two heavy jobs read this job's booleans and
  # `verify-self` reads the whole resolution as JSON, so no two jobs can disagree
  # about what a pull request touched — which two independent computations
  # eventually would.
  #
  # WHY THIS IS A JOB AND NOT `on: paths:`. A workflow filtered out at the trigger
  # produces no check run at all. `main`'s required contexts then never report,
  # and a merge-queue entry waits on them until the status-check timeout dequeues
  # it. A job that runs DOES report, under a name the queue recognises.
  #
  # AND NOT A SKIPPED JOB EITHER, which is what #803 tried. A skipped job files a
  # `skipped` check run that would satisfy a required check — but a job with a
  # `strategy.matrix` skipped by its own `if:` never expands the matrix, so the
  # check is filed as `verify-browser` and not `verify-browser (22.x)`, which is
  # the name actually required. The required context then never reports and the
  # queue hangs exactly as if the check had been filtered away at the trigger.
  # So the two heavy jobs below always run and gate their STEPS. See the long note
  # on verify-browser and docs/design/harness-engineering.md#path-aware-ci.
  #
  # `fetch-depth: 0` is load-bearing. `actions/checkout` defaults to a depth-1
  # clone in which the base commit does not exist, so `git diff` fails — and the
  # resolver treats that as "run everything". Getting it wrong would therefore not
  # break CI; it would silently turn this entire mechanism into a no-op that
  # always runs the full suite, which is far harder to notice than a failure.
  #
  # No `pnpm install`: the resolver imports only node builtins and reads
  # `harness.config.json` plus each `packages/*/package.json` off the checkout.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # 15, not 5, and the number is guarding the CHECKOUT rather than the resolver.
    # The resolver runs in ~2s; the `fetch-depth: 0` fetch above it is bimodal —
    # normally 16-43s, but with a heavy tail. Measured over 20 consecutive CI runs
    # on 2026-08-19: four took 268-318s and THREE of those crossed the old 5-minute
    # ceiling. Only 22 branches and 42 tags exist, so this is not ref volume; the
    # variance is on GitHub's git endpoint and is not ours to fix.
    #
    # Timing out here is far more expensive than it looks, which is why the headroom
    # is generous. This job is already fail-safe — every consumer reads
    # `needs.changes.result != 'success' || heavy == 'true'`, so a failure here makes
    # them run EVERYTHING — but a job cancelled by `timeout-minutes` makes the whole
    # RUN conclude `cancelled`, and the agent pipeline gates its fix/promote jobs on
    # `needs.ci.outputs.conclusion == 'success'`. On #899 that stopped the loop dead
    # after round 3 with two blocking findings outstanding: all three verify lanes had
    # PASSED, and nothing paged, because `cancelled` is handled by neither
    # agent-iterate-ci.yml (which fires only on `failure`) nor the panel's `stalled`
    # net (which needs a `failure` among its needs).
    #
    # So the cost of this ceiling being too low is a silently stalled PR, while the
    # cost of it being too high is one runner sitting idle. Do not lower it back
    # without re-measuring the fetch tail.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # `||` because the resolver may not have run at all; an unset output is the
      # empty string, which is the only falsy string, so a real `false` from the
      # resolver still wins over the fallback. See `Fall back to the unscoped suite`.
      full: ${{ steps.resolve.outputs.full || steps.unresolved.outputs.full }}
      heavy: ${{ steps.resolve.outputs.heavy || steps.unresolved.outputs.heavy }}
      ci_config: ${{ steps.resolve.outputs.ci_config }}
      areas: ${{ steps.resolve.outputs.areas }}
    steps:
      # TWO SHORT ATTEMPTS RATHER THAN ONE LONG ONE. Measured across 30 runs, this
      # checkout takes 13-22s and never more than 57s, while its failures all sit at
      # the 5-minute job timeout with nothing in between: a stalled `fetch-depth: 0`
      # of this history does not finish late, it does not finish. So 2 minutes is
      # ~2x the worst observed success and nowhere near the stall, and a second
      # attempt clears a transient one without paying for the unscoped suite.
      - uses: actions/checkout@v4
        id: checkout
        timeout-minutes: 2
        continue-on-error: true
        with:
          fetch-depth: 0
          # This job only reads history to compute a diff, so it does not need a
          # credential left behind in `.git/config` — and this is the one job whose
          # output every gate below trusts, so it is the last place to leave a
          # writable token lying around.
          persist-credentials: false

      - uses: actions/checkout@v4
        id: retry
        if: steps.checkout.outcome != 'success'
        timeout-minutes: 2
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.checkout.outcome == 'success' || steps.retry.outcome == 'success'
        with:
          node-version: 22.x

      - name: Resolve changed areas
        id: resolve
        if: steps.checkout.outcome == 'success' || steps.retry.outcome == 'success'
        run: node ./scripts/changed-areas.mjs

      # NEITHER ATTEMPT LANDED, so there is no repository to diff and no resolution.
      # This job still SUCCEEDS: nothing is broken, the scope simply is not known,
      # and a red check for a run that went on to verify everything reads as a
      # failure that did not happen.
      #
      # `heavy` has to be said out loud. The gates below read this output, and an
      # unset one is indistinguishable from "nothing heavy changed" — which is how
      # `verify-browser` and `verify-integration`, both REQUIRED checks, would report
      # green having run nothing. `scripts/test/ci-workflow.test.mjs` pins that.
      #
      # `areas` stays unset deliberately: `scripts/verify-self.mjs` reads an empty
      # resolution as "run every lane", so the unscoped suite falls out of the same
      # absence rather than out of a second copy of the decision.
      - name: Fall back to the unscoped suite
        id: unresolved
        if: steps.checkout.outcome != 'success' && steps.retry.outcome != 'success'
        run: |
          echo "::warning::Could not check out the repository in two attempts, so CI's scope was not resolved. Every lane and both heavy jobs run."
          {
            echo "full=true"
            echo "heavy=true"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## What changed"
            echo
            echo "**Full suite.** The checkout did not complete in two attempts, so the"
            echo "scope was never resolved — every lane and both heavy jobs run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain the decision
        if: steps.resolve.outcome == 'success'
        # On the run itself, and this is the copy that ALWAYS works: it needs no
        # token, so unlike the PR comment it survives a fork PR even if the App
        # credentials are missing. `ci-report.yml` renders the same reasons onto
        # the pull request.
        env:
          AREAS: ${{ steps.resolve.outputs.areas }}
        run: |
          node -e '
            const a = JSON.parse(process.env.AREAS);
            const out = [];
            out.push("## What changed");
            out.push("");
            out.push(a.full
              ? "**Full suite.** Every lane and both heavy jobs run."
              : "**Reduced run.** Lane selection is on"
                + (a.heavy ? " and the heavy jobs still run." : " and the heavy jobs are skipped."));
            out.push("");
            if (a.packages?.length) out.push(`- affected packages (incl. dependents): \`${a.packages.join("`, `")}\``);
            if (a.tags?.length) out.push(`- areas: \`${a.tags.join("`, `")}\``);
            for (const r of a.reasons ?? []) out.push(`- ${r}`);
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '
          if [ "${{ steps.resolve.outputs.ci_config }}" = "true" ]; then
            echo "::warning::This PR changes a file that decides how much CI runs (see harness.config.json ci.ciConfig). The full suite is forced for this PR, but review the mapping change on its own merits — it affects every later PR."
          fi

      # Hand the decision to `ci-report.yml`, which does the PR writes. It cannot
      # recompute this: a `workflow_run` job checks out nothing from the pull
      # request, and it must not — that is the whole reason it is allowed to hold a
      # token. So the resolution travels as DATA, in an artifact.
      #
      # The PR number travels with it because `github.event.workflow_run
      # .pull_requests` is EMPTY for a fork PR. That array is populated only for
      # same-repo branches, which is the one case that never needed this.
      #
      # Written via `env:` rather than interpolated into the script body, so a
      # changed path containing a quote cannot break out of the command.
      #
      # UNDER `runner.temp`, AND NOT A DOTTED DIRECTORY IN THE WORKSPACE. The first
      # draft used `.ci-context/`, which `review-panel.test.mjs` rejected on sight:
      # `upload-artifact@v4` resolves a directory path with @actions/glob, whose
      # default excludes hidden entries — including the search ROOT — so a dotted
      # directory uploads NOTHING and `if-no-files-found: warn` swallows it. The
      # artifact would have existed, been empty, and left the reporter unable to
      # find the pull request. `include-hidden-files: true` is the other fix; a
      # non-hidden path outside the workspace is the better one, and it matches
      # what docker-publish.yml already does with `runner.temp`/digests.
      - name: Save the resolution for the reporter
        # `always()`: this artifact is the reporter's only input, and the run that
        # most needs explaining is the one whose resolution failed. Both files come
        # from the event rather than the repository, so neither needs a checkout —
        # and an empty `areas.json` is what `ci-report.yml` already treats as
        # "the resolution could not be read".
        if: always() && github.event_name == 'pull_request'
        env:
          AREAS: ${{ steps.resolve.outputs.areas }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTEXT_DIR: ${{ runner.temp }}/ci-context
        run: |
          mkdir -p "$CONTEXT_DIR"
          printf '%s' "$AREAS" > "$CONTEXT_DIR/areas.json"
          printf '%s' "$PR_NUMBER" > "$CONTEXT_DIR/pr-number"

      - name: Upload the CI context
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-context
          path: ${{ runner.temp }}/ci-context/
          if-no-files-found: error
          retention-days: 7

  verify-self:
    needs: changes
    # `!cancelled()` and not the default, because the default is the dangerous
    # one. Without an `if:`, a job whose `needs` FAILED is skipped — and GitHub
    # counts a skipped required check as passing, so a crash in the `changes` job
    # above (a checkout failure, a bad node install, anything) would silently skip
    # this entire suite and leave the PR mergeable with nothing verified.
    #
    # Running anyway is safe because it degrades to a FULL run rather than an
    # unfiltered guess: a failed `changes` job produces an empty `areas` output,
    # so `WAFFLEBASE_CHANGED_AREAS` is empty, `resolve()` falls through to
    # computing it here, and the depth-1 checkout below makes `git diff` fail —
    # which the resolver treats as "run everything".
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A ceiling on a hang, not a performance budget. Without it this job inherits
    # GitHub's 360-minute default. On 2026-08-06 a regression stalled the
    # `agent:tests` lane 2.3s in: run 31073290840 printed 305 of the 1180 tests
    # that commit's lane prints locally, never printed a summary, and sat silent
    # for 31.5 minutes until someone with write access cancelled it by hand.
    # Uncancelled it would have burned six hours of runner time.
    #
    # 20 min is ~2.2x the slowest healthy run: across the 188 successful runs
    # between 2026-07-31 and 2026-08-06, verify-self's max was 9.3 min, p99 9.3,
    # median 8.6 — a distribution under a minute wide, so the headroom is large
    # relative to the variance it has to absorb. It is also well under the 31.5
    # minutes the incident actually cost, which a looser value would not be.
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Self-Contained Lane
        # The resolution is passed in rather than recomputed, so this job needs no
        # deep clone and cannot reach a different conclusion than the gates on the
        # two heavy jobs below.
        env:
          WAFFLEBASE_CHANGED_AREAS: ${{ needs.changes.outputs.areas }}
        run: pnpm verify:self

      # The coverage steps re-run three whole test suites, so they are gated too —
      # otherwise an agent-only PR would skip its lanes and then spend minutes
      # collecting coverage for packages it did not touch, which is most of what
      # this change exists to stop. `heavy` rather than `full`: coverage is only
      # meaningful when a workspace package changed, and that is exactly what
      # `heavy` means.
      - name: Collect coverage (sheets)
        if: needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @wafflebase/sheets exec vitest run --coverage

      - name: Collect coverage (cli)
        if: needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @wafflebase/cli exec vitest run --coverage

      - name: Collect coverage (docs)
        if: needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @wafflebase/docs exec vitest run --coverage

      - name: Collect coverage (backend)
        if: needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true'
        run: pnpm --filter @wafflebase/backend test:cov
        continue-on-error: true

      - name: Upload coverage to Codecov
        # Not in the merge queue. The SHA under test there is a throwaway
        # `gh-readonly-queue` commit that need never reach `main` — a failing entry
        # is dequeued and the entries behind it are rebuilt without it — so
        # coverage filed against it lands on a commit Codecov cannot reach from any
        # branch. The `push` run on `main` right after the queue merges reports the
        # same tree, so no coverage is actually lost. Skipping also keeps
        # CODECOV_TOKEN out of the environment of runs whose tree contains
        # not-yet-merged fork code: a `merge_group` run executes in the base repo,
        # so it is not sandboxed the way a fork's `pull_request` run is.
        #
        # Also not when the coverage steps above were gated out — there would be
        # no lcov files to upload, and Codecov reports a partial run as a coverage
        # drop rather than as an absence.
        if: >-
          github.event_name != 'merge_group' &&
          (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true')
        uses: codecov/codecov-action@v4
        with:
          files: >-
            packages/sheets/coverage/lcov.info,
            packages/cli/coverage/lcov.info,
            packages/docs/coverage/lcov.info,
            packages/backend/coverage/lcov.info
          flags: sheets,cli,docs,backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload harness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: .harness-reports/
          include-hidden-files: true
          retention-days: 14

  verify-browser:
    runs-on: ubuntu-latest
    needs: [changes, verify-self]
    # THE FILTER IS ON THE STEPS, NOT ON THIS JOB, AND THAT IS THE WHOLE POINT.
    #
    # #803 put `if: … heavy == 'true' …` here instead, on the reasoning that GitHub
    # records a skipped job as a `skipped` check run which satisfies a required
    # check. The first half is true. The half that is not: a job with a
    # `strategy.matrix` that is skipped by a job-level `if:` NEVER EXPANDS ITS
    # MATRIX, so the check run it files is named after the bare job — `verify-browser`
    # — and not `verify-browser (22.x)`, which is the name branch protection and the
    # merge queue actually require. Measured on the `merge_group` SHA for #799:
    #
    #   verify-self (22.x)   success     <- ran, so the matrix expanded
    #   verify-browser       skipped     <- BARE NAME
    #   verify-integration   skipped     <- BARE NAME
    #
    # `verify-browser (22.x)` therefore reported nothing at all, the queue sat on
    # "Expected — Waiting for status to be reported", and the entry would have been
    # dequeued at the status-check timeout. Exactly the failure the design set out
    # to avoid, reached by a different route: not a missing check RUN, a missing
    # check NAME. MAINTAINING.md's warning that "required check names must keep
    # matching" covers renaming a job; it turns out skipping one renames it too.
    #
    # So the job always runs and always expands. When the filter says there is
    # nothing to test, every step below no-ops and `verify-browser (22.x)` reports
    # success in seconds — same semantics the skip was reaching for, under a name
    # that exists. The residual cost is one runner for a few seconds.
    #
    # `!cancelled()` plus an explicit `verify-self` check, rather than no `if:` at
    # all: a bare `needs:` failure would skip this job (bare name again) whenever
    # `changes` failed while `verify-self` passed, which is the one combination that
    # could still strand the queue. When `verify-self` itself fails this job IS
    # skipped and that is safe — the entry is already doomed by `verify-self (22.x)`.
    if: ${{ !cancelled() && needs.verify-self.result == 'success' }}
    env:
      # The filter decision, once, for every step below.
      #
      # `needs.changes.result != 'success'` comes FIRST and is a fail-safe, not a
      # formality: if that job crashed there is no `heavy` output, the comparison
      # would be `'' == 'true'`, and this would read as "these tests were not
      # required after all". A broken filter must always mean more testing.
      #
      # The label escape hatch is for any PR, not only forks: a maintainer who
      # distrusts the mapping for one change can demand the whole suite with a
      # click and no rebase. It cannot work on `merge_group`, whose payload carries
      # no PR labels — the same limitation `agent-iterate-ci.yml` resolves by
      # looking the PR up, which is not worth a job here.
      RUN_HEAVY: >-
        ${{ needs.changes.result != 'success' ||
            needs.changes.outputs.heavy == 'true' ||
            contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    # Same reasoning as verify-self, same sample: max 9.3 min, p95 7.6, median
    # 6.5 across those 188 successful runs, so 20 min is ~2.2x the worst observed.
    # This job's spread is the widest of the three (median to max is +43%) because
    # it builds and runs a Playwright image, which is the part most exposed to
    # registry and build-cache latency — a reason to keep the multiple, not shrink it.
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Every step carries the gate. Skipping the JOB would rename its check run
      # (see the note above); skipping the STEPS costs a few seconds of runner and
      # keeps the name.
      - name: Why this job is doing nothing
        if: env.RUN_HEAVY != 'true'
        run: |
          echo "::notice::verify-browser had nothing to test — no workspace package changed. See the 'What changed' job summary."
          echo "Reporting success without running the browser suite, by design." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.RUN_HEAVY == 'true'

      - uses: pnpm/action-setup@v4
        if: env.RUN_HEAVY == 'true'

      - name: Use Node.js ${{ matrix.node-version }}
        if: env.RUN_HEAVY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        if: env.RUN_HEAVY == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Docker image
        if: env.RUN_HEAVY == 'true'
        run: docker build -t wafflebase-playwright -f Dockerfile.playwright .

      - name: Run browser tests in Docker
        if: env.RUN_HEAVY == 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e WAFFLEBASE_DOCKER_BROWSER=true \
            wafflebase-playwright

      - name: Upload actual screenshots on failure
        # `failure()` alone would also fire for a failure in an earlier gated step;
        # the conjunction keeps this to a genuine browser-test failure.
        if: failure() && env.RUN_HEAVY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-actual
          path: |
            packages/frontend/tests/visual/baselines/*.actual.png
            packages/frontend/tests/visual/baselines/*.diff.png
          retention-days: 14

  verify-integration:
    runs-on: ubuntu-latest
    needs: [changes, verify-self]
    # Same contract as verify-browser above: the gate is on the STEPS, because a
    # matrix job skipped by a job-level `if:` files its check run under the bare
    # name `verify-integration` and never under `verify-integration (22.x)`, which
    # is the required context. See the long note on verify-browser.
    #
    # ONE THING DOES NOT NO-OP HERE: the `services:` block below. Service containers
    # are brought up by the runner before the first step and cannot be made
    # conditional, so a filtered run still pays for Postgres starting (~seconds).
    # The Yorkie container is started by a STEP, so it is gated. The expensive part
    # — install, four builds, migrate, the e2e suite — is all steps and all gated.
    #
    # Gated on `heavy`, which means ANY workspace package changed — deliberately
    # blunter than the reverse-dependency closure that drives lane selection. This
    # job builds core + docs + slides + sheets below and its e2e set includes
    # `docs-cli-roundtrip`, `notes-cli-roundtrip` and `slides-pptx-import`, so a
    # change to an engine package with no backend file in it can absolutely break
    # it. Narrowing this to the closure is a later step, taken against observed
    # behaviour rather than against this reasoning.
    if: ${{ !cancelled() && needs.verify-self.result == 'success' }}
    # 10 rather than 20: this job is genuinely shorter — max 4.4 min, p99 3.6,
    # median 2.8 over the same 188 successful runs — and a ceiling that could
    # never bind is not a ceiling. ~2.3x the worst observed, matching the multiple
    # used on the other two jobs. The Postgres service and the Yorkie container
    # are inside that measurement; the wait-for-port step below already gives up
    # after 30s, so a stalled Yorkie fails with a diagnosis long before this.
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://wafflebase:wafflebase@localhost:5432/wafflebase
      DATASOURCE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RUN_DB_INTEGRATION_TESTS: "true"
      # Pair with the Yorkie service below to unlock the
      # `docs-tree-attached` and `docs-cli-roundtrip` e2e specs that
      # need a real Yorkie server. Locally these are gated the same
      # way (`docker compose up -d` + this env var); CI matches that
      # contract instead of skipping them.
      RUN_YORKIE_INTEGRATION_TESTS: "true"
      YORKIE_RPC_ADDR: http://localhost:8080
      # The filter decision, once, for every step below. See the note on
      # verify-browser for why this is not a job-level `if:`.
      RUN_HEAVY: >-
        ${{ needs.changes.result != 'success' ||
            needs.changes.outputs.heavy == 'true' ||
            contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wafflebase
          POSTGRES_PASSWORD: wafflebase
          POSTGRES_DB: wafflebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wafflebase -d wafflebase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Yorkie is intentionally NOT declared as a `service:` here —
      # GitHub Actions' service map has no `command:` field, and the
      # `yorkieteam/yorkie` image's entrypoint is just `["yorkie"]`
      # (no default CMD), so the server subcommand has to come from
      # `docker run`'s positional args. We start it as a background
      # step below; the wait-for-port step makes the lifecycle as
      # well-behaved as a real service.

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Every step carries the gate; skipping the JOB would rename its check run.
      - name: Why this job is doing nothing
        if: env.RUN_HEAVY != 'true'
        run: |
          echo "::notice::verify-integration had nothing to test — no workspace package changed. See the 'What changed' job summary."
          echo "Reporting success without running the integration suite, by design." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.RUN_HEAVY == 'true'

      - uses: pnpm/action-setup@v4
        if: env.RUN_HEAVY == 'true'

      - name: Use Node.js ${{ matrix.node-version }}
        if: env.RUN_HEAVY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        if: env.RUN_HEAVY == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages the CLI imports at runtime
        if: env.RUN_HEAVY == 'true'
        # `verify:integration` spawns the CLI via `tsx packages/cli/src/bin.ts`.
        # The CLI eagerly imports `@wafflebase/docs` and `@wafflebase/slides/node`,
        # both of which resolve via each package's `exports` field to a
        # built file under `dist/`. The `verify-self` job builds these on
        # its own runner; `verify-integration` is a separate runner that
        # starts without those artifacts, so we rebuild them here.
        # `@wafflebase/core` must build first because docs/slides consume
        # it via `dist/`; its dist is gitignored, so a fresh runner has
        # nothing to import until this step runs.
        run: |
          pnpm core build
          pnpm --filter @wafflebase/docs build
          pnpm slides build
          pnpm sheets build

      - name: Start Yorkie server
        if: env.RUN_HEAVY == 'true'
        run: |
          # Match the image and CLI args used by `docker-compose.yaml`
          # so local + CI behavior stays aligned. `--pprof-enabled`
          # mirrors local dev; the perf overhead is negligible for a
          # short integration run.
          docker run -d --name yorkie \
            -p 8080:8080 -p 8081:8081 \
            yorkieteam/yorkie:latest server --pprof-enabled

      - name: Wait for Yorkie to accept connections on :8080
        if: env.RUN_HEAVY == 'true'
        run: |
          # The container starts before this step but Yorkie's gRPC
          # listener takes a couple seconds to bind. Poll until the
          # port answers (or fail after 30 attempts × 1s = 30s).
          for i in $(seq 1 30); do
            if nc -z localhost 8080; then
              echo "Yorkie is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Yorkie did not become reachable on :8080" >&2
          docker logs yorkie || true
          exit 1

      - name: Verify Integration Lane
        if: env.RUN_HEAVY == 'true'
        id: integration
        run: pnpm verify:integration

      - name: Yorkie logs on failure
        if: failure() && steps.integration.outcome == 'failure' && env.RUN_HEAVY == 'true'
        run: docker logs yorkie
