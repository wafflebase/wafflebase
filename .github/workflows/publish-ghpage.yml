name: GitHub Page Publish

on:
  # WAITS FOR CI. This was `push: main`, a separate workflow with no `needs:`, so
  # wafflebase.io was published in parallel with the run deciding whether main was
  # green — a red main deployed anyway. The other half of the gate is in
  # `scripts/changed-areas.mjs`: a `push` to `main` is never path-filtered, so the
  # run this waits on is always the complete suite.
  #
  # A SIBLING at level 2 of the `workflow_run` chain, not a new link: `ci.yml` →
  # `agent-review-panel.yml` → `capture-collect.yml` already uses GitHub's
  # three-level limit with no headroom (see capture-collect.yml). Nothing may be
  # inserted between CI and this workflow.
  #
  # `paths-ignore` is GONE because `workflow_run` supports no path filter. Its
  # behaviour is preserved by the "Is the published site affected" step below —
  # deliberately, and not just for runner minutes: this workflow retains only
  # KEEP_COUNT=3 deployments' worth of hashed assets, so deploying on merges that
  # cannot change the site would shorten the window in which a client holding a
  # cached index.html can still fetch what it references.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy for a burst of merges, newest wins. Cancelling is safe: `keep_files:
# true` makes each deploy additive, and the cleanup step below prunes by SET
# rather than by diff, so a run cancelled between deploy and cleanup leaves stale
# assets that the next run removes.
concurrency:
  group: publish-ghpage
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # See docker-publish.yml for why all four clauses are needed — in particular
    # `event == 'push'`, without which a fork PR opened from a branch called
    # `main` (most forks' default) would satisfy the trigger's `branches` filter.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit CI verified, not main's tip, which may already have moved
          # to something whose CI has not reported. Two commits of history so the
          # affected-paths check below can diff against the first parent.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Is the published site affected?
        id: affected
        # Replaces the `paths-ignore: packages/backend/**` that `workflow_run`
        # cannot express. Same rule: deploy unless EVERY changed path is under
        # packages/backend/. Fails open — an unresolvable parent (a first commit,
        # a shallow fetch, a manual dispatch) deploys, because a missed deploy is
        # a stale public site and a redundant one costs minutes.
        # Through `env:` rather than interpolated into the script body. Neither
        # value is attacker-controlled today (a SHA is hex and the event name is
        # GitHub's own), but a `${{ }}` inside a shell script is textual
        # substitution, so the safe habit is worth more than the audit.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — deploying."
            exit 0
          fi
          SHA="$HEAD_SHA"
          if ! git rev-parse --verify -q "$SHA^" >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit available — deploying."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$SHA^" "$SHA")
          if [ -z "$CHANGED" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Empty diff — deploying."
            exit 0
          fi
          # Counted with a POSITIVE match rather than tested with `grep -qv`,
          # because `-v` combined with `-q` is not portable: GNU grep exits 0 when
          # ANY line fails to match, and ugrep 7.5 (what a `brew`/`apt` grep alias
          # can resolve to locally) exits 1 on the same input. The runner has GNU
          # grep, so the `-qv` form would have been right here and untestable
          # anywhere else — which is worse than right. `grep -c` agrees across
          # both.
          N_BACKEND=$(printf '%s\n' "$CHANGED" | grep -c '^packages/backend/' || true)
          N_TOTAL=$(printf '%s\n' "$CHANGED" | wc -l | tr -d ' ')
          if [ "$N_BACKEND" -lt "$N_TOTAL" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Site-affecting paths changed ($N_BACKEND of $N_TOTAL are backend-only) — deploying."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "All $N_TOTAL changed paths are under packages/backend/ — skipping the site deploy."
          fi

      - name: Install pnpm
        if: steps.affected.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - name: Setup Node
        if: steps.affected.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and Build
        if: steps.affected.outputs.deploy == 'true'
        # build:all runs `pnpm core build` first — required because the
        # core dist/ (incl. tokens.css imported by the frontend) is gitignored
        # — then builds the frontend + docs and copies docs into the frontend dist.
        #
        # THE FIVE VITE_* VALUES ARE THIS DEPLOYMENT'S CONFIGURATION, and they
        # are baked into the bundle at build time. They used to live in a
        # committed `packages/frontend/.env.production`, which Vite ranks above
        # the localhost `.env` beside it in mode `production` — so every fork
        # and self-host that ran `pnpm frontend build` with no overrides shipped
        # a bundle addressing wafflebase's own backend and Yorkie project and
        # reporting its visitors into wafflebase's Google Analytics property,
        # with nothing failing visibly. That file is gone; these values now live
        # with the deployment that uses them.
        #
        # `vars.*`, not `secrets.*`: none of the five is a secret. All five ship
        # inside a public JS bundle, and the Yorkie key is a *public* key. Using
        # `vars` keeps them readable in the run log, which is where you want
        # deployment configuration when a deploy comes out wrong.
        #
        # `vars.*`, not hardcoded here either: a fork inherits none of the
        # repository's variables, so hardcoding would restore exactly the bug
        # above — a fork enabling this workflow would republish wafflebase's
        # backend URL and GA measurement ID from its own Pages site. With
        # variables, a fork gets the loud failure below instead.
        #
        # Missing values FAIL rather than fall back. A failure here costs a
        # deploy and leaves the currently published site exactly as it is —
        # strictly better than publishing a broken or upstream-pointing bundle
        # over a working one. The mechanism is step ordering, not
        # `keep_files`: every later step carries a bare `if:`, which GitHub
        # implicitly ANDs with `success()`, so a failure here skips Deploy
        # entirely and nothing is published. (`keep_files: true` governs what a
        # deploy that *does* run leaves behind on gh-pages; it would matter
        # only if a partial build reached the Deploy step.) Adding
        # `always()`/`failure()` to any later step's `if:` would remove that
        # protection.
        #
        # Through `env:` rather than interpolated into the script body, for the
        # same reason as the affected-paths step above: `${{ }}` in a shell
        # script is textual substitution, and unlike a SHA these values are
        # free-form strings typed into a settings page.
        env:
          # Optional. `/` is React Router's own default for `basename` and
          # matches Vite's default `base`, so it is a generic default rather
          # than upstream configuration; set the variable only when the site is
          # served from a subpath.
          VITE_FRONTEND_BASENAME: ${{ vars.VITE_FRONTEND_BASENAME || '/' }}
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
          VITE_YORKIE_RPC_ADDR: ${{ vars.VITE_YORKIE_RPC_ADDR }}
          VITE_YORKIE_PUBLIC_KEY: ${{ vars.VITE_YORKIE_PUBLIC_KEY }}
          # Optional, and deliberately so: unset means no gtag.js is emitted at
          # all (`gaSnippet()` in packages/frontend/vite.config.ts strips the
          # marker), which is the right default for anyone who is not
          # wafflebase. Note this also reaches the VitePress build inside
          # `build:all` — a `VITE_` variable in the environment outranks every
          # `.env*` file, including `packages/documentation/.env.production`.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          missing=""
          [ -n "$VITE_BACKEND_API_URL" ] || missing="$missing VITE_BACKEND_API_URL"
          [ -n "$VITE_YORKIE_RPC_ADDR" ] || missing="$missing VITE_YORKIE_RPC_ADDR"
          [ -n "$VITE_YORKIE_PUBLIC_KEY" ] || missing="$missing VITE_YORKIE_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Cannot build the site: repository variable(s)$missing are unset or empty."
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            echo "See packages/frontend/.env.production.example for what each one is."
            exit 1
          fi
          # Both endpoints must additionally be https://. This is not general
          # hardening — it is specific to where this workflow publishes. GitHub
          # Pages serves only over https, so a bundle built against an http://
          # backend has every request blocked by the browser's mixed-content
          # rules: credentialed auth (cookies), the notifications SSE stream and
          # Yorkie sync all fail at runtime, with nothing wrong in the build log
          # to explain it. Failing here names the offending variable instead.
          #
          # VITE_YORKIE_PUBLIC_KEY is deliberately not checked — it is a project
          # key, not an endpoint.
          #
          # Reached only once `missing` is empty, so both values are non-empty
          # here and an unset variable is reported by one gate rather than two.
          #
          # `case` rather than a bare `[ ]`: its exit status is 0 whether or not
          # a branch matches, so it cannot trip the `bash -e` these `run:` blocks
          # execute under — the same care the `|| assignment` idiom above takes.
          # The pattern is literal and lowercase (`?*` also rejects a bare
          # "https://"), so an uppercased scheme is refused as well; lowercase is
          # what every URL in the examples uses.
          cleartext=""
          case "$VITE_BACKEND_API_URL" in https://?*) ;; *) cleartext="$cleartext VITE_BACKEND_API_URL" ;; esac
          case "$VITE_YORKIE_RPC_ADDR" in https://?*) ;; *) cleartext="$cleartext VITE_YORKIE_RPC_ADDR" ;; esac
          if [ -n "$cleartext" ]; then
            echo "::error::Cannot build the site: repository variable(s)$cleartext must be https:// URLs."
            echo "This site is published to GitHub Pages, which is https-only, so a cleartext endpoint is blocked as mixed content in the browser and the app cannot work at all."
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "Building with:"
          echo "  VITE_FRONTEND_BASENAME=$VITE_FRONTEND_BASENAME"
          echo "  VITE_BACKEND_API_URL=$VITE_BACKEND_API_URL"
          echo "  VITE_YORKIE_RPC_ADDR=$VITE_YORKIE_RPC_ADDR"
          echo "  VITE_YORKIE_PUBLIC_KEY=$VITE_YORKIE_PUBLIC_KEY"
          echo "  VITE_GA_ID=${VITE_GA_ID:-<unset — no analytics snippet>}"
          pnpm i
          pnpm build:all

      - name: Create asset manifest
        if: steps.affected.outputs.deploy == 'true'
        # Covers both hashed-asset trees: the frontend's own `assets/` and the
        # VitePress `docs/assets/` copied in by build:all. Anything missing here
        # is invisible to the cleanup step below and accumulates forever.
        #
        # A manifest that silently omits a tree is worse than no manifest at
        # all: cleanup deletes by set, so the omitted tree's current build
        # would be pruned away. `find` exits non-zero on a missing directory
        # but still writes what it did find, and without pipefail `sort`
        # swallows that — so assert the directories and enable pipefail.
        run: |
          set -o pipefail
          mkdir -p packages/frontend/dist/.manifests
          (
            cd packages/frontend/dist
            for dir in assets docs/assets; do
              if [ ! -d "$dir" ]; then
                # stderr, not stdout: this subshell's stdout is the manifest.
                echo "::error::Build output $dir is missing; refusing to write a partial manifest" >&2
                exit 1
              fi
            done
            find assets docs/assets -type f | LC_ALL=C sort
          ) > packages/frontend/dist/.manifests/$(date -u +%Y%m%dT%H%M%SZ).txt

      - name: Deploy
        if: steps.affected.outputs.deploy == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/frontend/dist
          enable_jekyll: false
          cname: wafflebase.io
          keep_files: true

      - name: Cleanup old assets
        if: steps.affected.outputs.deploy == 'true'
        # `keep_files: true` above never deletes, so this step is the only
        # counterweight. It is set-based, not diff-based: the keep-set is the
        # union of the newest KEEP_COUNT manifests, and every tracked file under
        # the hashed-asset trees outside that set goes. A diff over expired
        # manifests can never reach a file no manifest ever named, which is how
        # ~300 generations of docs/assets/chunks piled up and pushed the Pages
        # deployment past the 600s timeout in actions/deploy-pages.
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-tmp origin/gh-pages

          cd gh-pages-tmp

          # Retain this many deployments' worth of hashed assets, so clients
          # holding a cached index.html can still load what it references.
          KEEP_COUNT=3

          # Trees the manifests describe, and the only ones we prune.
          # pdfjs/ is excluded on purpose: stable, unhashed filenames.
          ASSET_DIRS="assets docs/assets"

          MANIFESTS=($(ls -1 .manifests/*.txt 2>/dev/null | sort -r))

          if [ ${#MANIFESTS[@]} -eq 0 ]; then
            echo "No manifests found, nothing to clean up"
            cd ..
            git worktree remove gh-pages-tmp
            exit 0
          fi

          # Deleting by set makes a bad manifest catastrophic rather than a
          # no-op, so refuse rather than empty the site. Non-empty is not
          # enough: a manifest covering only one of the trees would prune the
          # other tree's current build, so require every tree to appear.
          if [ ! -s "${MANIFESTS[0]}" ]; then
            echo "::error::Newest manifest ${MANIFESTS[0]} is empty; refusing to prune"
            exit 1
          fi

          for dir in $ASSET_DIRS; do
            if ! grep -q "^$dir/" "${MANIFESTS[0]}"; then
              echo "::error::Newest manifest ${MANIFESTS[0]} names nothing under $dir/; refusing to prune"
              exit 1
            fi
          done

          # Keep-set: every asset named by the KEEP_COUNT most recent manifests.
          cat "${MANIFESTS[@]:0:$KEEP_COUNT}" | LC_ALL=C sort -u > /tmp/keep-assets.txt
          git ls-files -- $ASSET_DIRS | LC_ALL=C sort > /tmp/tracked-assets.txt
          LC_ALL=C comm -23 /tmp/tracked-assets.txt /tmp/keep-assets.txt > /tmp/stale-assets.txt

          CHANGED=false

          if [ -s /tmp/stale-assets.txt ]; then
            echo "Pruning $(wc -l < /tmp/stale-assets.txt) asset(s) older than $KEEP_COUNT deployments"
            tr '\n' '\0' < /tmp/stale-assets.txt | xargs -0 git rm -q --
            CHANGED=true
          fi

          for f in "${MANIFESTS[@]:$KEEP_COUNT}"; do
            git rm -q "$f"
            CHANGED=true
          done

          if [ "$CHANGED" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Clean up assets older than $KEEP_COUNT deployments"
            git push origin HEAD:gh-pages
          else
            echo "Nothing to clean up"
          fi

          cd ..
          git worktree remove gh-pages-tmp
