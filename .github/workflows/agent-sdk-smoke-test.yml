# One-press LIVE credential check for the review panel's Agent SDK.
#
# The one pre-arm item that can't be verified statically: does the configured
# CLAUDE_CODE_OAUTH_TOKEN actually authenticate the SDK on a runner? A maintainer
# runs this manually — Actions ▸ "Agent SDK Auth Smoke Test" ▸ Run workflow —
# BEFORE arming the pipeline (setting AGENT_PIPELINE_ENABLED=true). It uses the
# same SDK auth path as agent-review-panel.yml, so a green run here means the
# panel will authenticate too. It reviews nothing (allowedTools: []) and needs no
# repo write.
#
# Deliberately NOT gated on AGENT_PIPELINE_ENABLED — the whole point is to test
# BEFORE arming — and it can only ever run via manual dispatch.
#
# THIS IS NOW A SHIM: the workflow body lives in the pipeline repo, and three
# things here are load-bearing. Each was measured on a real runner rather than
# assumed, and each fails in a way that is hard to read.
#
# 1. THE `id-token: write` GRANT. A called workflow's job may only request
#    permissions the CALLER already granted, and the pipeline's `pin` job needs
#    the OIDC claim to prove which pipeline commit this run is about to trust.
#    Omit it and the run is a `startup_failure` with zero jobs and no message.
#
# 2. `secrets: inherit` IS THE DELIVERY MECHANISM, not decoration. This repo keeps
#    CLAUDE_CODE_OAUTH_TOKEN as a REPOSITORY secret, and environment secrets do
#    not reach a called workflow's job at all — measured: a token in the
#    environment, with the job naming that environment, still arrived empty.
#    Remove this line and the smoke test loses its credential.
#
# 3. THE `agent` ENVIRONMENT STILL GATES SPEND. Protection rules DO apply to a
#    called workflow's job (measured: a required reviewer left it in `waiting`
#    with a pending deployment), so the environment keeps doing the job it was
#    added for — it just cannot also be the secret store. The called workflow
#    names it through its `environment` input, which defaults to `agent`.
name: Agent SDK Auth Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to smoke-test (blank = auth-smoke.mjs's default)"
        required: false
        default: ""

permissions: {}

env:
  # Kept rather than dropped in the conflict resolution. This shim runs no steps
  # of its own, and the pipeline's pin job addresses gh at an explicit
  # `repos/<owner>/<repo>/…` path rather than the `{owner}/{repo}` placeholder
  # that needs a git remote — so nothing here needs it TODAY. It stays because the
  # next step added to this file would need it, and its absence fails obscurely:
  # that was the #790 outage.
  GH_REPO: ${{ github.repository }}

jobs:
  smoke:
    permissions:
      id-token: write # the pipeline's pin job needs the OIDC claim — see above
    uses: wafflebase/agent-pipeline/.github/workflows/auth-smoke.yml@249dd44a63f510ab74977858d0ebe3e28a14684d # v0.3.1
    with:
      # Asserted against the OIDC claim by the pin job; must match the pin above.
      pipeline-ref: 249dd44a63f510ab74977858d0ebe3e28a14684d # v0.3.1
      # Forwarded so this stays the pre-flight for a MODEL change too, not just a
      # credential check — "does this model id resolve on the pinned SDK, with
      # this token". Blank falls through to the script's own default.
      model: ${{ inputs.model }}
    secrets: inherit # required: the token is a REPOSITORY secret — see above
