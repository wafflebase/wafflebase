# One-press LIVE credential check for the review panel's Agent SDK.
#
# The one pre-arm item that can't be verified statically: does the configured
# CLAUDE_CODE_OAUTH_TOKEN actually authenticate the SDK on a runner? A maintainer
# runs this manually — Actions ▸ "Agent SDK Auth Smoke Test" ▸ Run workflow —
# BEFORE arming the pipeline (setting AGENT_PIPELINE_ENABLED=true). It uses the
# same `agent` environment secret and the same SDK auth path as
# agent-review-panel.yml, so a green run here means the panel will authenticate
# too. It reviews nothing (allowedTools: []) and needs no repo write.
#
# Deliberately NOT gated on AGENT_PIPELINE_ENABLED — the whole point is to test
# BEFORE arming — and it can only ever run via manual dispatch.
name: Agent SDK Auth Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to smoke-test (blank = auth-smoke.mjs's default)"
        required: false
        default: ""

permissions: {}

env:
  # gh expands `{owner}/{repo}` by shelling out to git, so it needs a git remote in
  # the working directory. The trusted pipeline now arrives in a scratch path that
  # is deleted after the move, so a job that runs scripts before any repo checkout
  # has no .git at all. GH_REPO makes gh skip the git lookup. Set at workflow level
  # so it covers every job and every script, present and future.
  GH_REPO: ${{ github.repository }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agent # where CLAUDE_CODE_OAUTH_TOKEN lives
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch can target ANY ref; force the REVIEWED, PINNED copy of
          # auth-smoke.mjs + the lockfile so a pushed branch can't swap in a script
          # that exfiltrates CLAUDE_CODE_OAUTH_TOKEN. (Also restrict the `agent`
          # environment's deployment branches to `main` in repo settings.)
          repository: wafflebase/agent-pipeline
          ref: 1165ea60eff49fc830691bb00d5a7c9259f9f3db # v0.3.0
          path: .pipeline-src
          sparse-checkout: packages/pipeline
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # ADAPTER (transitional). The pipeline now lives in its own repo at
      # packages/pipeline; put it where every step below already looks for it so
      # this change touches checkout blocks only. Phase D removes this together
      # with the scripts/agent path itself.
      - name: Place the trusted pipeline where the steps expect it
        run: |
          set -euo pipefail
          mkdir -p scripts
          mv .pipeline-src/packages/pipeline scripts/agent
          rm -rf .pipeline-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # Install WITHOUT the auth secret in scope (same rule as the panel's
      # unprivileged deps job: never run `npm ci` lifecycle scripts with the
      # token present). Only the next step gets the token.
      - name: Install the Agent SDK
        run: cd scripts/agent && npm ci --no-audit --no-fund
      # auth-smoke.mjs already honours SMOKE_MODEL; wiring it to a dispatch input
      # makes this the pre-flight for a model change too, not just a credential
      # check — "does this model id resolve on the pinned SDK, with this token".
      # Blank falls through to the script's own default.
      - name: Live auth check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SMOKE_MODEL: ${{ inputs.model }}
        run: node scripts/agent/auth-smoke.mjs
