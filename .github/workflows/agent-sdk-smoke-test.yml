# Pre-arm auth check. A shim: the workflow itself lives in the pipeline repo.
#
# Three things here are load-bearing, and each was measured on a real runner
# rather than assumed — every one of them fails in a way that is hard to read.
#
# 1. THE `id-token: write` GRANT. A called workflow's job may only request
#    permissions the CALLER already granted, and the pipeline's `pin` job needs
#    the OIDC claim to prove which pipeline commit this run is about to trust.
#    Omit it and the run is a `startup_failure` with zero jobs and no message.
#
# 2. `secrets: inherit` IS THE DELIVERY MECHANISM, not decoration. This repo
#    keeps CLAUDE_CODE_OAUTH_TOKEN as a REPOSITORY secret, and environment
#    secrets do not reach a called workflow's job at all — measured: a token in
#    the environment, with the job naming that environment, still arrived empty.
#    Remove this line and the smoke test loses its credential.
#
# 3. THE `agent` ENVIRONMENT STILL GATES SPEND. Protection rules DO apply to a
#    called workflow's job (measured: a required reviewer left it in `waiting`
#    with a pending deployment). The environment gates the JOB; it just cannot
#    also be the secret store. The called workflow names it through its
#    `environment` input, which defaults to `agent`. Note this repo's `agent`
#    environment currently has no protection rules configured — see #784.
#
# The pipeline is pinned by commit SHA rather than tag, matching the convention
# already applied to every other pipeline checkout: the pin is the only thing
# establishing which code runs, and tag protection is an invisible repo setting.
#
# Deliberately NOT gated on AGENT_PIPELINE_ENABLED: the point is to test BEFORE
# arming.
name: Agent SDK Auth Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to smoke-test (blank = auth-smoke.mjs's default)"
        required: false
        default: ""

permissions: {}

env:
  # Kept from main rather than dropped in the conflict resolution. This shim runs
  # no steps of its own, and the pipeline's pin job addresses gh at an explicit
  # `repos/<owner>/<repo>/…` path rather than the `{owner}/{repo}` placeholder
  # that needs a git remote — so nothing here needs it TODAY. It stays because the
  # next step added to this file would need it, and its absence fails obscurely.
  GH_REPO: ${{ github.repository }}

jobs:
  smoke:
    permissions:
      id-token: write # the pipeline's pin job needs the OIDC claim — see above
    uses: wafflebase/agent-pipeline/.github/workflows/auth-smoke.yml@1165ea60eff49fc830691bb00d5a7c9259f9f3db # v0.3.0
    with:
      # Asserted against the OIDC claim by the pin job; must match the pin above.
      pipeline-ref: 1165ea60eff49fc830691bb00d5a7c9259f9f3db # v0.3.0
      # Forwarded so this stays the pre-flight for a MODEL change too, not just a
      # credential check — "does this model id resolve on the pinned SDK, with
      # this token". Blank falls through to the script's own default.
      #
      # This input arrived on main while the PR was open, and the automatic merge
      # dropped it: it resolved the `on:` block in this branch's favour, silently
      # discarding the dispatch input while keeping the step that read it. Restored
      # deliberately.
      model: ${{ inputs.model }}
    secrets: inherit # required: the token is a REPOSITORY secret — see above
