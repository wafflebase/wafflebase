# Pre-arm auth check. A shim: the workflow itself lives in the pipeline repo.
#
# THE `id-token: write` GRANT IS LOAD-BEARING. A called workflow's job may only
# request permissions the CALLER has already granted, and the pipeline's `pin`
# job needs the OIDC claim to prove which pipeline commit this run is about to
# trust. Omit it and the run is a `startup_failure` with zero jobs and no usable
# message — measured, not theorised.
#
# CLAUDE_CODE_OAUTH_TOKEN is NOT passed at call time. It stays in the protected
# `agent` environment, which is what lets a required reviewer gate spend, and the
# called workflow's job reads it through its own `environment:` — environments
# resolve in the caller. `secrets: inherit` cannot forward an environment secret,
# so passing it explicitly would mean moving it to repository scope and losing
# that gate.
#
# Deliberately NOT gated on AGENT_PIPELINE_ENABLED: the whole point is to test
# BEFORE arming.
name: Agent SDK Auth Smoke Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    permissions:
      id-token: write # the pipeline's pin job needs the OIDC claim — see above
    uses: wafflebase/agent-pipeline/.github/workflows/auth-smoke.yml@v0.2.1
    with:
      pipeline-ref: v0.2.1
    secrets: inherit
