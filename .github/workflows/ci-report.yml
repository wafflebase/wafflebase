# Report CI's scope onto the pull request — the one job in this pair allowed to
# write, and therefore the one that must never run pull-request code.
#
# WHY IT IS A SEPARATE WORKFLOW. A fork's `pull_request` run gets a read-only
# GITHUB_TOKEN and no secrets, so `ci.yml` posting its own comment failed
# silently on every fork PR (#789..#798). It cannot be fixed by giving `ci.yml` a
# token: secrets are withheld from a fork's run, and `verify-self` executes the
# PR's own build and test code, so a write-capable token there is one the author
# can exfiltrate. `workflow_run` solves both — it runs in the base repository
# with secrets, from THIS file on the default branch rather than the PR's copy.
#
# THE INVARIANT: this workflow performs NO checkout of pull-request code, runs no
# `pnpm`, and executes nothing from the triggering run. It reads two artifacts as
# DATA and calls the API. Do not add `actions/checkout` of `head_sha`, and do not
# add a build step. If it ever needs repository code, check out the BASE ref.
#
# CHAIN DEPTH. GitHub allows three levels of `workflow_run` chaining, and
# `ci.yml` -> `agent-review-panel.yml` -> itself already uses all three (see
# `capture-collect.yml`). This is a SIBLING at level 2, like the two deploy
# workflows, so that chain is untouched.
name: CI Report

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# No write scope on the ambient token. Every write below goes through the App
# installation token, scoped to `issues: write` — which covers PR comments and
# labels both.
permissions:
  contents: read
  actions: read # list the triggering run's jobs and download its artifacts
  pull-requests: read # bind the artifact's PR number to this run, and list its files

# Keyed on the triggering run so a re-run supersedes its own report rather than
# racing it. Not keyed on the PR: two runs for one PR are two different results.
concurrency:
  group: ci-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    # Only pull requests have somewhere to post. `always()` is deliberately NOT
    # used, but there is no status gate either: this must run for a FAILED CI run
    # too, and `workflow_run` fires on `completed` regardless of conclusion.
    # The `path` clause is not redundant with the trigger: `workflow_run`'s
    # `workflows:` filter matches the run's DISPLAY NAME, and a second file
    # saying `name: CI` produces runs it accepts. Unlike docker-publish and
    # publish-ghpage — whose `head_branch == 'main'` clause means a forgery would
    # have to be MERGED first — this one fires on PR branches, so the file that
    # produced the run has to be checked here. Only one file can occupy
    # `.github/workflows/ci.yml`.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `continue-on-error` on both: a CI run that died before `verify-self`
      # produced reports still deserves a comment saying so, and a missing
      # artifact must not turn this into a second red X on the PR.
      - name: Download the harness reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: harness-reports
          path: harness-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download the CI context
        id: context
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-context
          path: ci-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true # a repo without the App configured degrades to the ambient token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          # `issues: write` and nothing else, deliberately. Requesting a
          # permission the installation was never granted makes this step FAIL,
          # and `continue-on-error` would then degrade every write to a read-only
          # token. The reads live in the next step instead.
          permission-issues: write

      # ---- every READ, on the ambient token --------------------------------
      # `actions/github-script` injects ONE bound `github` client per step, built
      # from that step's `github-token:`, and does not make `@actions/github`
      # requirable — the action is bundled and this workflow checks out no code,
      # so there is no `node_modules` to resolve against. #831 built a second
      # client here with `require('@actions/github').getOctokit(...)`; it threw
      # `Cannot find module '@actions/github'` before the first API call on every
      # run, taking the label and the comment with it. Two steps with two
      # `github-token:` inputs is how you get two identities. Do NOT add a
      # checkout to make `require` work.
      - name: Resolve what to report
        id: resolve
        uses: actions/github-script@v7
        with:
          # Everything below needs `contents`/`pull-requests`/`actions` read,
          # none of which the App token holds.
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            // ---- which pull request -------------------------------------------
            // `run.pull_requests` is EMPTY for a fork PR, so the number is carried
            // in the artifact. The head-SHA lookup is the fallback for a run whose
            // `changes` job died before uploading it.
            let prNumber = null;
            try {
              prNumber = parseInt(fs.readFileSync('ci-context/pr-number', 'utf8').trim(), 10);
            } catch { /* fall through */ }
            if (!Number.isInteger(prNumber)) {
              prNumber = run.pull_requests?.[0]?.number ?? null;
            }
            if (!Number.isInteger(prNumber)) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              });
              prNumber = data.find((p) => p.state === 'open')?.number ?? data[0]?.number ?? null;
            }
            if (!Number.isInteger(prNumber)) {
              core.warning('No pull request could be resolved for this run; nothing to report.');
              return;
            }

            // ---- bind that number to THIS run ---------------------------------
            // `ci-context/pr-number` was written by a job that ran the pull
            // request's own code, so on a fork it is attacker-chosen. Unvalidated,
            // it aims the App token's writes at any issue in the repository.
            // Requiring the named PR's head to be this run's commit confines them.
            //
            // It gates the write step, which is `if:`-conditioned on the output
            // below, so a failed bind means no write happens at all.
            //
            // Consequence: a re-run of a superseded commit reports nothing. That
            // is the safe direction — the newer run posts its own.
            const pr = await github.rest.pulls
              .get({ owner, repo, pull_number: prNumber })
              .then((r) => r.data)
              .catch(() => null);
            if (!pr || pr.head.sha !== run.head_sha) {
              core.warning(
                `Refusing to report on #${prNumber}: its head is not this run's commit ` +
                `(${run.head_sha.slice(0, 9)}).`,
              );
              return;
            }
            core.setOutput('pr_number', String(prNumber));

            // ---- which heavy jobs were skipped --------------------------------
            // Taken from the run's real job outcomes, not from `areas.heavy`: the
            // two disagree whenever the `full-ci` label overrode a reduced
            // resolution, and "what was skipped" is this comment's whole payload,
            // so it has to be what actually happened. `actions: read` is
            // ambient-only, which is why it cannot move to the write step.
            //
            // NOT the job's own conclusion. `ci.yml` gates the STEPS and never
            // the job, because a job-level `if:` renames the check run and the
            // renamed one is not the required context — so a heavy job that did
            // nothing still concludes `success`, and reading the job would report
            // every reduced run as a full one. The gate-marker step is the only
            // signal that the gate closed; `scripts/test/ci-workflow.test.mjs`
            // pins its name against `ci.yml` so the two cannot drift apart.
            //
            // An unset output means UNKNOWN, which the comment renders as neither.
            const HEAVY = ['verify-browser', 'verify-integration'];
            const GATE_STEP = 'Why this job is doing nothing';
            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              const skipped = HEAVY.filter((needle) => {
                const j = jobs.find((x) => x.name.startsWith(needle));
                const gate = (j?.steps ?? []).find((s) => s.name === GATE_STEP);
                return gate?.conclusion === 'success';
              });
              core.setOutput('skipped', JSON.stringify(skipped));
            } catch (error) {
              core.warning(`Could not list this run's jobs: ${error.message}`);
            }

            // ---- the label, and the files that earned it ----------------------
            // Visible half of the CI-config guard; the mechanical halves are
            // `ci.ciConfig` forcing the full suite and CODEOWNERS requiring a
            // review. So a failure here warns rather than fails the job.
            //
            // Decided here rather than read from `areas.ciConfig`, because that
            // file is written by a job that ran the PR's own code — driving a
            // REMOVAL from it would let a fork delete its own warning — and
            // because `classify()` emits `ciConfig: false` for fail-safe
            // resolutions too ("we never found out"), which must not clear it.
            //
            // The file list comes from the API and the globs from the default
            // branch, both beyond the PR's reach.
            const LABEL = 'ci-config-changed';

            // Same semantics as `globToRegExp` in scripts/changed-areas.mjs: `**`
            // crosses separators, a single `*` does not. Duplicated because this
            // workflow deliberately checks out no code; `ci-workflow.test.mjs`
            // compares the two so the copy cannot drift.
            const globToRegExp = (glob) => {
              let out = '';
              for (let i = 0; i < glob.length; i++) {
                const c = glob[i];
                if (c === '*') {
                  if (glob[i + 1] === '*') {
                    i++;
                    if (glob[i + 1] === '/') { i++; out += '(?:.*/)?'; } else { out += '.*'; }
                  } else {
                    out += '[^/]*';
                  }
                } else if ('\\^$.|?+()[]{}'.includes(c)) {
                  out += `\\${c}`;
                } else {
                  out += c;
                }
              }
              return new RegExp(`^${out}$`);
            };

            let gatingGlobs = null;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo,
                path: 'harness.config.json',
                ref: context.payload.repository.default_branch,
              });
              const config = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              gatingGlobs = config.ci?.ciConfig ?? null;
            } catch (error) {
              core.warning(`Could not read ci.ciConfig from the default branch: ${error.message}`);
            }

            // `leave` is the fail-safe: only a COMPLETE negative answer may clear
            // the label, so every unknown below resolves to it.
            let decision = 'leave';
            if (!Array.isArray(gatingGlobs) || gatingGlobs.length === 0) {
              core.warning(`Leaving the ${LABEL} label alone: the gating globs are unreadable.`);
            } else {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                const patterns = gatingGlobs.map(globToRegExp);
                const matched = files
                  .map((f) => f.filename)
                  .filter((name) => patterns.some((re) => re.test(name)));
                if (matched.length > 0) {
                  decision = 'add';
                  // Named in the comment, so a reviewer sees WHICH file widened
                  // the run without opening the diff. Capped: the reader needs a
                  // few examples, not a manifest.
                  core.setOutput('gating_files', JSON.stringify(matched.slice(0, 10)));
                  core.setOutput('gating_total', String(matched.length));
                } else if (files.length >= 3000) {
                  // The endpoint stops at 3000 files, so "no match" in a truncated
                  // list is not a negative.
                  core.warning(`Leaving the ${LABEL} label alone: the file list was truncated.`);
                } else {
                  decision = 'remove';
                }
              } catch (error) {
                core.warning(`Could not decide the ${LABEL} label: ${error.message}`);
              }
            }
            core.setOutput('label', decision);

      # ---- every WRITE, on the App token -----------------------------------
      # Skipped when the step above could not bind a pull request to this run, so
      # the App token is never aimed at a number that failed validation.
      - name: Post the CI scope summary
        if: steps.resolve.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          # Through `env:` rather than interpolated into the script body, so a
          # value cannot splice itself into source text.
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          SKIPPED: ${{ steps.resolve.outputs.skipped }}
          GATING_FILES: ${{ steps.resolve.outputs.gating_files }}
          GATING_TOTAL: ${{ steps.resolve.outputs.gating_total }}
          LABEL_DECISION: ${{ steps.resolve.outputs.label }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const prNumber = Number(process.env.PR_NUMBER);

            // WHAT THIS COMMENT IS FOR. Not whether the checks passed — GitHub
            // already shows that in the PR's own checks list, and duplicating it
            // buries the part that is shown nowhere. This reports the SCOPE
            // decision: what CI skipped, and which changed file forced the whole
            // suite. Both are otherwise only visible inside a job log.
            const clean = (v, max = 200) =>
              String(v ?? '')
                .replace(/[\r\n|`<>]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, max);

            const readJson = (p) => {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); }
              catch { return null; }
            };
            const readEnvJson = (k) => {
              try { return JSON.parse(process.env[k] || 'null'); }
              catch { return null; }
            };

            // `areas.json` and `summary.json` were produced by a job running the
            // PULL REQUEST's code, so every string out of them is
            // attacker-controlled and only ever reaches markdown through `clean`.
            const areas = readJson('ci-context/areas.json');
            const summary =
              readJson('harness-reports/summary.json') ??
              readJson('harness-reports/.harness-reports/summary.json');
            const skipped = readEnvJson('SKIPPED');
            const gatingFiles = readEnvJson('GATING_FILES');

            const marker = '<!-- harness-verification -->';
            const lines = [marker];

            // The heading is what the run DID. The gating-file list is recomputed
            // independently — base-branch globs against the API's file list — so it
            // can only ever be a reason appended below, never the scope claim
            // itself: when the two disagree, a gating-file heading would assert a
            // suite that did not run.
            if (skipped === null) {
              // The jobs read failed. Not knowing what was skipped is not the
              // same as nothing having been skipped, and this comment exists to
              // report exactly that — so say so rather than claim the happy case.
              lines.push('### CI scope unknown', '');
              lines.push("This run's job outcomes could not be read, so what was skipped is unknown.");
            } else if (skipped.length > 0) {
              lines.push('### Reduced CI', '');
              lines.push(`Skipped: ${skipped.map((s) => `\`${s}\``).join(', ')}`, '');
              for (const reason of areas?.reasons ?? []) lines.push(`- ${clean(reason)}`);
              lines.push('', 'Add the **`full-ci`** label and re-run to force the whole suite.');
            } else {
              lines.push('### Full CI', '');
              lines.push('No job was skipped.');
            }

            if (gatingFiles && gatingFiles.length > 0) {
              const total = Number(process.env.GATING_TOTAL) || gatingFiles.length;
              const shown = gatingFiles.map((f) => `\`${clean(f, 120)}\``).join(' · ');
              const more = total > gatingFiles.length ? ` and ${total - gatingFiles.length} more` : '';
              lines.push('', `Gating files changed: ${shown}${more}`);
              lines.push('These decide how much CI every later PR runs, so this one is meant to run the whole suite.');
            }

            // Lane filtering happens inside `verify-self` and is visible nowhere
            // else — not in the checks list, not in the job name. One line.
            //
            // Coerced rather than `clean`ed: these are counts, so a non-number is a
            // `summary.json` the pull request's own code wrote to smuggle markup —
            // an HTML comment forging the marker above, under the bot's identity.
            // Drop the line instead.
            const count = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : null);
            const lanesRun = count(summary?.lanesRun);
            const lanesTotal = count(summary?.lanesTotal);
            const lanesFiltered = count(summary?.lanesFiltered);
            if (lanesFiltered !== null && lanesFiltered > 0 && lanesRun !== null && lanesTotal !== null) {
              lines.push('', `Lanes: ${lanesRun} of ${lanesTotal} ran, ${lanesFiltered} filtered.`);
            } else if (!summary) {
              lines.push('', '`verify:self` produced no lane report — it may have crashed before writing one, or been skipped.');
            }

            lines.push('', `<sub>[run](${run.html_url}) · ${run.head_sha.slice(0, 9)}</sub>`);
            const body = lines.join('\n') + '\n';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            // ---- apply the label ------------------------------------------------
            // Decided in the read step; `leave` means it could not be decided
            // safely. See the reasoning there.
            const LABEL = 'ci-config-changed';
            try {
              if (process.env.LABEL_DECISION === 'add') {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: prNumber, labels: [LABEL],
                });
              } else if (process.env.LABEL_DECISION === 'remove') {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: LABEL,
                }).catch((error) => {
                  // 404 is the normal path: the label was not on the PR.
                  if (error.status !== 404) throw error;
                });
              }
            } catch (error) {
              core.warning(`Could not update the ${LABEL} label: ${error.message}`);
            }
