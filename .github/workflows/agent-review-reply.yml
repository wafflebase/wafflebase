# Develop-review loop, review arm: when a trusted human mentions "@claude" WITHOUT
# a recognized command verb (i.e. the generic address-this-feedback fallback) on
# an agent-authored PR (top-level comment or inline review comment), Claude Code
# evaluates the finding, pushes a fix commit if warranted, and replies inside the
# thread per CONTRIBUTING.md. It pushes back with reasoning when a finding is
# wrong. It never merges.
#
# The command verb is parsed by the shared scripts/agent/command.mjs in a cheap
# `route` job; this arm runs ONLY for `reply`. "@claude review|summarize|loop" are
# their own workflows, so gating on `reply` here is what stops this job from
# double-firing on those commands.
name: Agent Review Reply

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write # reply in PR comment threads

env:
  # gh expands `{owner}/{repo}` via git; GH_REPO makes it skip that lookup.
  GH_REPO: ${{ github.repository }}

jobs:
  # Parse the command verb (shared scripts/agent/command.mjs). Runs for any
  # "@claude" comment on a PR (issue_comment fires for PRs too — gate on
  # github.event.issue.pull_request — or an inline review comment). The reply arm
  # below only proceeds when the verb is the generic `reply`.
  route:
    if: >-
      vars.AGENT_PIPELINE_ENABLED == 'true' &&
      github.event.comment.user.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the router script only
    outputs:
      command: ${{ steps.route.outputs.command }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/agent/command.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Route command
        id: route
        env:
          BODY: ${{ github.event.comment.body }}
        run: node scripts/agent/command.mjs "$BODY" pr

  reply:
    needs: [route]
    # Only the generic `reply` verb (an "@claude" mention that is NOT fix /
    # review / summarize / loop) from a trusted author. author_association is the
    # cheap pre-filter; the Verify-access step below is authoritative. Restricted
    # to agent-authored branches by the is_agent gate + the agent only acting on
    # its own PR context.
    if: >-
      vars.AGENT_PIPELINE_ENABLED == 'true' &&
      needs.route.outputs.command == 'reply' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: agent
    # Job-level concurrency so an unrelated comment that fails the `if` is
    # skipped without occupying the group. Queue (don't cancel) so multiple
    # review replies on the same PR are handled in order.
    concurrency:
      group: agent-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      WAFFLEBASE_AGENT_AUTONOMOUS: "true"
    steps:
      # author_association in the `if` is a weak signal (org membership ≠ repo
      # write). This is the authoritative gate — same as agent-implement.yml —
      # since this job also grants contents:write and runs a code-pushing agent.
      - name: Verify commenter has write access
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          retries: 3
          script: |
            const actor = context.payload.comment.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: actor,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed(`@${actor} lacks write access (permission: ${data.permission}); refusing to run.`);
            }

      - name: Resolve PR head branch
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          retries: 3
          script: |
            const num = context.payload.issue?.number || context.payload.pull_request?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: num,
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('is_agent', String(pr.head.ref.startsWith('agent/')));

      - name: Skip non-agent PRs
        if: steps.pr.outputs.is_agent != 'true'
        run: echo "Not an agent-authored branch; leaving this to the humans." && exit 0

      # Auth git ops as the Claude GitHub App, not GITHUB_TOKEN — commits pushed
      # with GITHUB_TOKEN do NOT re-trigger CI (GitHub's recursion guard), which
      # would stall the review loop.
      - name: Generate GitHub App token
        id: app-token
        if: steps.pr.outputs.is_agent == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # pnpm and Node are set up BEFORE the branch is checked out, so nothing in
      # the branch decides which pnpm or Node this job runs: the workspace
      # here is still empty.
      # The pnpm version is given here rather than read from a `packageManager`
      # field, and scripts/test/agent-workflow-guards.test.mjs keeps it equal to
      # main's. Both actions are pinned to a commit, because they run in a job
      # that holds tokens. No `cache:` — this job neither restores nor saves a
      # dependency cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.pr.outputs.is_agent == 'true'
        with:
          version: 10.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pr.outputs.is_agent == 'true'
        with:
          node-version: 22.x

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.pr.outputs.is_agent == 'true'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Not persisted: nothing between this checkout and the agent needs to
          # push, so the token is not written into the checkout the install
          # runs in. The agent step configures its own push credential from
          # `github_token` (claude-code-action does that in every mode), and the
          # read-only `git ls-remote` calls in this job need none on a public
          # repository.
          persist-credentials: false

      # A TRUSTED copy of `scripts/agent`, staged OUTSIDE the workspace: the
      # dependency install and the credential picker below both run from it.
      # This job's workspace is the PR BRANCH, so `./scripts/agent` here is the
      # branch's own copy — and the picker is handed all nine pool secrets.
      # Running the branch's version of it would let a branch author read every
      # credential the pool holds. Main is checked out into a side directory
      # AFTER the branch checkout above (`actions/checkout` cleans its target
      # path, and a root checkout would delete this one), copied to
      # `$RUNNER_TEMP/agent-tools`, and the side directory removed again — the
      # same three steps `agent-iterate-ci.yml` uses. Nothing trusted is run
      # from inside the workspace: a path there is one the branch's own tree
      # can reach.
      #
      # THE PATH IS CLEARED FIRST. `.trusted-agent` is a name inside the branch's
      # tree, so whatever the branch has there is removed before main is checked
      # out to it.
      - name: Clear the path the trusted agent scripts are checked out to
        run: rm -rf .trusted-agent
      - name: Check out trusted main (for the install and the credential picker)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: .trusted-agent
          sparse-checkout: scripts/agent
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage the trusted agent scripts
        run: |
          cp -R .trusted-agent/scripts/agent "${{ runner.temp }}/agent-tools"
          rm -rf .trusted-agent

      # THE INSTALL IS MAIN'S, NOT THE BRANCH'S, AND IT RUNS NOTHING. From the
      # checkout above the workspace is the UNTRUSTED PR branch and this job
      # already holds a token, so the install comes from the trusted copy of
      # `scripts/agent` and treats the branch as data: exactly what the lockfile
      # names, inside the workspace, with no lifecycle scripts, hooks or branch
      # pnpm configuration. It refuses a tree it cannot install that way — see
      # scripts/agent/install-deps.mjs for the full list, and
      # scripts/test/agent-workflow-guards.test.mjs for what holds this step to it.
      #
      # No lifecycle script is re-run here. The backend's Prisma client is
      # generated by the agent itself, as part of verifying (`claude_args` below
      # says so).
      # THE STAGED SCRIPTS ARE FINGERPRINTED BEFORE THE INSTALL AND CHECKED AFTER
      # IT. Every later step of this job that holds a token runs a script from
      # `$RUNNER_TEMP/agent-tools`. The install is built to write nowhere but
      # the workspace and its own store; this is what says so for the one
      # directory those steps depend on. The digest is kept as a step output,
      # which nothing on the runner's disk can rewrite. On a mismatch the
      # directory is removed, so no later step — including the `always()` ones —
      # runs a script from it. (It says nothing about the steps after the agent:
      # the agent has a shell, and what it leaves there is a known limit.)
      - name: Record a digest of the staged agent scripts
        id: tools
        if: steps.pr.outputs.is_agent == 'true'
        run: |
          cd "$RUNNER_TEMP/agent-tools"
          digest="$({ find . -print | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        id: install
        if: steps.pr.outputs.is_agent == 'true'
        run: node "$RUNNER_TEMP/agent-tools/install-deps.mjs"
      - name: Verify the staged agent scripts are unchanged
        if: always() && steps.tools.outputs.digest != ''
        env:
          EXPECTED: ${{ steps.tools.outputs.digest }}
        run: |
          cd "$RUNNER_TEMP/agent-tools"
          actual="$({ find . -print | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED" ]; then
            cd "$RUNNER_TEMP"
            rm -rf "$RUNNER_TEMP/agent-tools"
            echo "::error::The staged agent scripts changed while dependencies were installed. They were removed; no later step of this job runs them." >&2
            exit 1
          fi

      # A REFUSED INSTALL SAYS SO ON THE PULL REQUEST. Without this the person
      # who wrote `@claude` gets a red job and no reply. The reason is in the
      # run's log as an `::error::` line; the comment links to it rather than
      # quoting it. Run from the runner's temp directory, not the workspace.
      - name: Tell the pull request the install did not complete
        if: failure() && steps.install.outcome == 'failure'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "🛑 \`@claude\` could not start: installing this branch's dependencies did not complete, so the agent never ran and nothing was changed. The agent jobs install only registry packages pinned by the lockfile, with main's pnpm version and workspace settings — a branch that changes those, or adds a dependency from anywhere else, needs a person. The reason is the \`install-deps\` error in the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

      # WHICH POOL SLOT THIS JOB USES — see agent-implement.yml for the full rationale.
      # Without it this step is pinned to slot zero of the pool and one dead account
      # takes the job down (issue #883).
      #
      # The nine secrets reach THIS step only; the action step below gets exactly one,
      # resolved from the slot number. That is the same split `ask.mjs::credentialEnv`
      # keeps, and it matters more here than anywhere else in the pipeline: the step
      # that follows runs against an untrusted checkout.
      - name: Pick a credential from the pool
        id: cred
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          CLAUDE_CODE_OAUTH_TOKEN_8: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_8 }}
        run: |
          [ -f "$RUNNER_TEMP/agent-tools/pick-credential.mjs" ] || {
            echo "pick-credential.mjs is not on main yet; using the ambient credential"
            exit 0
          }
          node "$RUNNER_TEMP/agent-tools/pick-credential.mjs"

      - name: Run Claude Code
        if: steps.pr.outputs.is_agent == 'true'
        # Pinned to the v1 release commit (immutable) for supply-chain safety.
        # Uses the action's native @claude mention handling, which has the thread
        # context. github_token is the App token so pushes re-trigger CI.
        uses: anthropics/claude-code-action@af0559ee4f514d1ef21826982bed13f7edc3c35e # v1
        with:
          claude_code_oauth_token: ${{ steps.cred.outputs.slot != '' && secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', steps.cred.outputs.slot)] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: >-
            --max-turns 40
            --model claude-opus-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --append-system-prompt "Dependencies were installed without lifecycle scripts, so the backend's Prisma client is not generated yet. Run 'pnpm --filter @wafflebase/backend exec prisma generate' once before 'pnpm verify:fast' or any backend test."
